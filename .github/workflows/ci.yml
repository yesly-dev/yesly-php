# Packagist picks up new tags by itself, so there is no release workflow.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.2", "8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - if: matrix.php == '8.4'
        run: vendor/bin/phpstan analyse --level=8 src --no-progress
